<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Darts 3D – Selección de Modo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.8s ease-out;
        }
        .btn {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 0.5rem;
            background: linear-gradient(90deg, #4f46e5, #6366f1);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(79,70,229,0.4);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card max-w-md w-full mx-4">
        <h1 class="text-4xl font-black mb-2 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-rose-400 to-indigo-400">Pro Darts 3D</h1>
        <p class="text-slate-300 text-sm mb-6">Elige tu modo y dispositivo de juego</p>

        <!-- Botón Especial Móvil -->
        <a href="mobile.html" class="block w-full py-3.5 px-4 mb-3 rounded-xl bg-gradient-to-r from-emerald-500 via-teal-600 to-cyan-600 text-white font-bold text-base shadow-lg shadow-emerald-500/30 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
            <span>📱</span>
            <span>Versión Móvil 3D (Táctil)</span>
            <span class="text-[10px] uppercase font-black bg-white/20 px-2 py-0.5 rounded-full ml-1">Nuevo</span>
        </a>

        <!-- Botón Power 3D PC -->
        <a href="pro_darts_3d_unreal_style_webgl.html" class="block w-full py-3 px-4 mb-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold text-base shadow-md hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
            <span>🖥️</span>
            <span>Power 3D (PC / Escritorio)</span>
        </a>

        <!-- Botón Clásica 2D -->
        <a href="classic.html" class="block w-full py-2.5 px-4 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 font-medium text-sm transition-all flex items-center justify-center gap-2 border border-white/10">
            <span>🎯</span>
            <span>Clásica (2D)</span>
        </a>

        <div id="mob-detector-hint" class="hidden mt-4 pt-3 border-t border-white/10 text-xs text-emerald-400 font-medium">
            💡 Hemos detectado un dispositivo móvil. Te sugerimos la <b>Versión Móvil 3D</b> para jugar sin menús sobre la diana.
        </div>
    </div>

    <script>
        if (window.innerWidth <= 768 || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) {
            const hint = document.getElementById('mob-detector-hint');
            if (hint) hint.classList.remove('hidden');
        }
    </script>
</body>
</html>
