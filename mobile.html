<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Darts 3D – Edición Móvil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
            /* Disable default touch scrolling/zooming on canvas area */
            #canvas-container { touch-action: none; }

        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #24160d 0%, #150d08 60%, #080402 100%);
            font-family: 'Inter', sans-serif;
            color: #f5eedc;
            touch-action: none;
        }
        .font-pub { font-family: 'Cinzel', serif; }
        .font-display { font-family: 'Chakra Petch', sans-serif; }
        
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Estilo Vidrio de Taberna / Madera y Fieltro */
        .hud-glass {
            background: rgba(30, 20, 14, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(217, 119, 6, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(254, 243, 199, 0.12);
        }

        .vignette-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 46%, rgba(12, 7, 4, 0.88) 100%);
        }

        /* Modal inicial / opciones */
        #mobile-setup-modal {
            position: fixed;
            inset: 0;
            background: rgba(16, 10, 6, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-y: auto;
        }
        #mobile-setup-modal.hidden { display: none !important; }

        @keyframes popFeedback {
            0% { transform: translate(-50%, -40%) scale(0.6); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -52%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -65%) scale(0.9); opacity: 0; }
        }
        .animate-feedback {
            animation: popFeedback 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .sweet-spot-glow {
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.85), inset 0 0 6px rgba(254, 243, 199, 0.7);
        }

        /* Pizarra Cricket Plegable */
        #mobile-cricket-drawer {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
        }
        #mobile-cricket-drawer.collapsed {
            display: none !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <!-- Contenedor 3D WebGL -->
    <div id="canvas-container"></div>
    <div class="vignette-overlay"></div>

    <!-- Feedback flotante al clavar dardo -->
    <div id="floating-feedback-container" class="pointer-events-none fixed inset-0 flex items-center justify-center z-40"></div>

    <!-- Controles Rápidos de Zoom en Pantalla Táctil -->
    <div id="zoom-controls" class="fixed right-2.5 top-1/2 -translate-y-1/2 flex flex-col gap-1.5 z-30 pointer-events-auto">
        <button id="mob-zoom-in" title="Acercar" class="w-8 h-8 rounded-full bg-amber-950/85 hover:bg-amber-900 border border-amber-600/50 text-amber-200 flex items-center justify-center font-bold text-sm shadow-lg active:scale-90 transition">
            +
        </button>
        <button id="mob-zoom-reset" title="Restablecer" class="w-8 h-6 rounded-md bg-amber-950/85 hover:bg-amber-900 border border-amber-600/50 text-amber-300 flex items-center justify-center font-bold text-[9px] shadow-lg active:scale-90 transition">
            1:1
        </button>
        <button id="mob-zoom-out" title="Alejar" class="w-8 h-8 rounded-full bg-amber-950/85 hover:bg-amber-900 border border-amber-600/50 text-amber-200 flex items-center justify-center font-bold text-sm shadow-lg active:scale-90 transition">
            −
        </button>
    </div>

    <!-- HUD Móvil Limpio (Cero obstrucción de la diana) -->
    <div class="relative z-10 pointer-events-none w-full h-full flex flex-col justify-between p-3" style="padding-top: max(0.6rem, env(safe-area-inset-top)); padding-bottom: max(0.6rem, env(safe-area-inset-bottom));">

        <!-- Zona Superior: Marcador + Turno + Cierre + Botón Pizarra -->
        <div class="flex flex-col gap-1 w-full pointer-events-none">
            <!-- Barra Superior Flotante: Marcador + Turno + Menú -->
            <div class="flex items-center justify-between w-full pointer-events-auto">
                <!-- Marcador Versus estilo Píldora Ocre / Fieltro -->
                <div class="hud-glass flex items-center gap-2 px-3 py-1.5 rounded-full border-amber-600/40">
                    <div id="mob-p1-box" class="flex items-baseline gap-1">
                        <span id="mob-p1-name" class="text-[11px] font-bold text-emerald-400 uppercase">COKE</span>
                        <span id="mob-p1-score" class="font-display font-extrabold text-amber-200 text-base">501</span>
                    </div>
                    <span class="text-[10px] font-extrabold text-amber-600">VS</span>
                    <div id="mob-p2-box" class="flex items-baseline gap-1">
                        <span id="mob-p2-name" class="text-[11px] font-bold text-amber-400 uppercase">IA</span>
                        <span id="mob-p2-score" class="font-display font-extrabold text-amber-100/70 text-base">501</span>
                    </div>
                </div>

                <!-- Indicador de Dardos de la Ronda (3 esferas luminosas ámbar) -->
                <div class="hud-glass flex items-center gap-1.5 px-2.5 py-1.5 rounded-full border-amber-600/40">
                    <span class="text-[9px] uppercase font-bold text-amber-400/80 mr-0.5">Dardos</span>
                    <div id="mob-dart-1" class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]"></div>
                    <div id="mob-dart-2" class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]"></div>
                    <div id="mob-dart-3" class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]"></div>
                </div>

                <div class="flex items-center gap-1">
                    <!-- Botón Alternar Pizarra Cricket (visible solo en modos Cricket) -->
                    <button id="btn-toggle-cricket" class="hidden h-8 px-2 rounded-full bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 text-[10px] font-bold shadow-lg active:scale-90 transition flex items-center gap-1">
                        <span>📋</span>
                        <span id="cricket-btn-label">Pizarra</span>
                    </button>
                    <!-- Botón Opciones / Menú -->
                    <button id="btn-open-menu" class="w-8 h-8 rounded-full bg-amber-950/90 border border-amber-600/40 text-amber-200 flex items-center justify-center text-xs shadow-lg active:scale-90 transition">
                        ⚙️
                    </button>
                </div>
            </div>

            <!-- Sugerencia de Cierre / Estado de Ronda en centro superior -->
            <div class="w-full flex justify-center pointer-events-none">
                <div id="mob-checkout-banner" class="hud-glass text-[10px] font-semibold text-amber-300 px-3 py-0.5 rounded-full border-amber-500/30 opacity-90 text-center">
                    Ronda 1 • Apunta tocando la diana
                </div>
            </div>

            <!-- Cajón Desplegable de Pizarra Cricket Móvil -->
            <div id="mobile-cricket-drawer" class="collapsed w-full max-w-sm mx-auto hud-glass rounded-2xl p-2.5 border-amber-600/40 shadow-2xl pointer-events-auto">
                <div class="flex items-center justify-between mb-1.5 px-1">
                    <span id="cricket-drawer-title" class="text-[11px] font-bold text-amber-300 uppercase tracking-wider">
                        📋 Cricket Normal (Más puntos gana)

                    <button id="btn-close-cricket" class="text-xs text-amber-400 font-bold px-1.5 py-0.5 rounded bg-amber-950/60 border border-amber-700/40">
                        ✕
                    </button>
                </div>
                <!-- Filas Cricket -->
                <div id="mob-cricket-rows" class="divide-y divide-amber-900/30 bg-black/40 rounded-xl overflow-hidden text-xs">
                    <!-- Rellenado dinámicamente -->
                </div>
                <div id="mob-cricket-note" class="text-[10px] text-amber-200/70 mt-1.5 text-center">
                    Cierra del 20 al 15 y Bull con 3 marcas (⊗).
                </div>
            </div>
        </div>

        <!-- Zona Inferior de Control de Tiro (Área del pulgar) -->
        <div class="w-full max-w-md mx-auto flex flex-col gap-2 pointer-events-auto">

            <!-- Barra de Precisión Estilo Golf (Fase 2) -->
            <div id="mob-golf-panel" class="hud-glass w-full rounded-2xl p-2.5 transition-all duration-200 border-amber-600/30">
                <div class="flex items-center justify-between text-[11px] mb-1 px-1">
                    <span id="mob-phase-badge" class="font-bold text-amber-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        <span id="mob-phase-text">Paso 1: Toca o arrastra en la diana</span>
                    </span>
                    <span id="mob-score-preview" class="text-emerald-300 font-bold">Precisión: --</span>
                </div>

                <!-- Pista de la Barra con Tonos de Fieltro y Madera -->
                <div class="relative w-full h-8 bg-black/70 rounded-xl border border-amber-700/40 overflow-hidden p-1 shadow-inner">
                    <!-- Centro y Sweet Spot -->
                    <div id="mob-sweet-zone" class="absolute top-1 bottom-1 rounded-md bg-emerald-600/60 border border-emerald-400 sweet-spot-glow transition-all" style="left: 45%; width: 10%;">
                        <div class="absolute left-1/2 top-0 bottom-0 -translate-x-1/2 w-0.5 bg-white shadow-[0_0_6px_#fff]"></div>
                    </div>
                    <!-- Aguja / Marcador móvil -->
                    <div id="mob-bar-needle" class="absolute top-0 bottom-0 w-2.5 -ml-1 rounded-full bg-amber-200 shadow-[0_0_12px_#f59e0b]" style="left: 10%;"></div>
                </div>
            </div>

            <!-- Botones de Acción Táctil (Fieltro verde y cuero ocre) -->
            <div class="flex items-center gap-2 w-full">
                <button id="mob-btn-cancel" class="hidden py-3.5 px-3 rounded-2xl bg-amber-950/90 border border-amber-600/50 text-amber-300 font-bold text-xs active:scale-95 transition flex items-center gap-1 shadow-lg">
                    <span>↩</span>
                    <span>Re-apuntar</span>
                </button>
                <button id="mob-btn-action" class="flex-1 py-3.5 px-4 rounded-2xl bg-gradient-to-r from-emerald-800 via-emerald-700 to-amber-800 active:scale-95 text-amber-100 font-pub font-bold text-base tracking-wider border border-amber-600/40 shadow-lg shadow-black/60 transition-transform flex items-center justify-center gap-2">
                    <span>🎯</span>
                    <span id="mob-btn-action-label">FIJAR ÁREA</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Modal de Configuración y Oponentes para Móvil -->
    <div id="mobile-setup-modal">
        <div class="hud-glass max-w-sm w-full p-5 sm:p-6 rounded-3xl border border-amber-600/50 text-center flex flex-col gap-4 shadow-2xl">
            <div>
                <h2 class="font-pub text-3xl font-extrabold text-amber-200 drop-shadow">
                    COKE'S DARTS
                </h2>
                <p class="text-xs uppercase tracking-wider text-amber-500 font-semibold mt-0.5">Edición Móvil • Salón de Dardos</p>
            </div>

            <!-- Oponente -->
            <div class="text-left">
                <label class="text-[11px] font-bold uppercase tracking-wider text-amber-400/80 mb-1 block">Oponente</label>
                <div class="grid grid-cols-3 gap-1.5" id="mob-opp-selector">
                    <button type="button" data-opp="VS_BOT" class="mob-opt-btn active-opt py-2 px-1 rounded-xl border border-emerald-500/50 bg-emerald-900/40 text-emerald-200 font-bold text-xs flex flex-col items-center gap-1">
                        <span>🤖</span>
                        <span>Vs Bot</span>
                    </button>
                    <button type="button" data-opp="2P" class="mob-opt-btn py-2 px-1 rounded-xl border border-amber-900/40 bg-black/40 text-amber-200/70 font-semibold text-xs flex flex-col items-center gap-1">
                        <span>👥</span>
                        <span>2 Jugad.</span>
                    </button>
                    <button type="button" data-opp="SOLO" class="mob-opt-btn py-2 px-1 rounded-xl border border-amber-900/40 bg-black/40 text-amber-200/70 font-semibold text-xs flex flex-col items-center gap-1">
                        <span>🎯</span>
                        <span>Práctica</span>
                    </button>
                </div>
            </div>

            <!-- Reglas (501 / Cricket Normal / Cricket Cut-Throat) -->
            <div class="text-left">
                <label class="text-[11px] font-bold uppercase tracking-wider text-amber-400/80 mb-1 block">Reglas de Competición</label>
                <div class="grid grid-cols-3 gap-1.5" id="mob-mode-selector">
                    <button type="button" data-mode="501" class="mob-mode-btn py-2 px-1 rounded-xl border border-amber-500 bg-amber-700/30 text-amber-200 font-bold text-[11px] text-center">
                        🎯 501
                    </button>
                    <button type="button" data-mode="CRICKET" class="mob-mode-btn py-2 px-1 rounded-xl border border-amber-900/40 bg-black/40 text-amber-200/70 font-semibold text-[11px] text-center">
                        📋 Cricket
                    </button>
                    <button type="button" data-mode="CRICKET_CUTTHROAT" class="mob-mode-btn py-2 px-1 rounded-xl border border-amber-900/40 bg-black/40 text-amber-200/70 font-semibold text-[11px] text-center">
                        ⚔️ Cut-Throat
                    </button>
                </div>
            </div>

            <!-- Nombres -->
            <div class="text-left flex flex-col gap-2">
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-amber-400/80 block mb-0.5">Tu Nombre</label>
                    <input type="text" id="mob-input-p1" value="COKE" class="w-full py-1.5 px-3 rounded-xl border border-amber-700/40 bg-black/60 text-amber-100 font-medium text-xs focus:border-amber-400 focus:outline-none" />
                </div>
                <div id="mob-p2-name-wrap">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-amber-400/80 block mb-0.5">Rival / Ordenador</label>
                    <input type="text" id="mob-input-p2" value="ORDENADOR (IA)" class="w-full py-1.5 px-3 rounded-xl border border-amber-700/40 bg-black/60 text-amber-100 font-medium text-xs focus:border-amber-400 focus:outline-none" />
                </div>
            </div>

            <!-- Dificultad IA -->
            <div class="text-left" id="mob-diff-wrap">
                <label class="text-[11px] font-bold uppercase tracking-wider text-amber-400/80 mb-1 block">Nivel del Bot</label>
                <div class="grid grid-cols-3 gap-1.5">
                    <button type="button" data-diff="0" class="mob-diff-btn py-1 rounded-lg border border-amber-900/40 bg-black/40 text-amber-200/70 text-xs">Fácil</button>
                    <button type="button" data-diff="1" class="mob-diff-btn py-1 rounded-lg border border-emerald-500 bg-emerald-900/30 text-emerald-200 text-xs font-bold">Normal</button>
                    <button type="button" data-diff="2" class="mob-diff-btn py-1 rounded-lg border border-amber-900/40 bg-black/40 text-amber-200/70 text-xs">Pro IA</button>
                </div>
            </div>

            <!-- Botón Jugar -->
            <button id="mob-btn-play-confirm" type="button" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-800 via-emerald-700 to-amber-800 text-amber-100 font-pub font-bold text-base tracking-wider border border-amber-600/40 shadow-lg shadow-black active:scale-95 transition-all">
                ¡JUGAR AHORA!
            </button>

            <!-- Enlaces a Menú y 2D Clásico -->
            <div class="flex items-center justify-center gap-3 pt-1 border-t border-amber-900/30 text-xs">
                <a href="index.html" class="text-amber-400/80 hover:text-amber-200 transition">🏠 Inicio</a>
                <span class="text-amber-800">•</span>
                <a href="classic.html" class="text-emerald-400 hover:text-emerald-200 font-bold transition">🕹️ Clásico 2D</a>
                <span class="text-amber-800">•</span>
                <a href="pro_darts_3d_unreal_style_webgl.html" class="text-amber-400/80 hover:text-amber-200 transition">🖥️ Versión PC</a>
            </div>
        </div>
    </div>

    <!-- Script del Motor de Juego 3D Móvil -->
    <script>
        // Background music (looped, low volume)
        const bgMusic = new Audio('https://cdn.jsdelivr.net/gh/lemontree123/free-audio/background.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.15;
        bgMusic.play().catch(() => {}); // handle autoplay restrictions
        // Preload vocal effect clips
        const wowAudio = new Audio('https://cdn.jsdelivr.net/gh/lemontree123/free-audio/wow.mp3');
        const ahhAudio = new Audio('https://cdn.jsdelivr.net/gh/lemontree123/free-audio/ahh.mp3');
        const huyAudio = new Audio('https://cdn.jsdelivr.net/gh/lemontree123/free-audio/huy.mp3');
        /********************************************************************
         * 1. AUDIO SINTETIZADO (WEB AUDIO API) + HÁPTICA VIBRACIÓN
         ********************************************************************/
        class MobileSoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            vibrate(ms = 15) {
                if ('vibrate' in navigator) {
                    try { navigator.vibrate(ms); } catch (e) {}
                }
            }
            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playLock() { this.vibrate(25); this.playTone(420, 'triangle', 0.08, 0.2); }
            playThrow() { this.vibrate(18); this.playTone(280, 'sine', 0.12, 0.25); }
            playImpact(isHigh = false) { this.vibrate(isHigh ? 45 : 20); this.playTone(isHigh ? 680 : 340, 'triangle', 0.15, 0.3); }
            playCricketClose() { this.vibrate(50); this.playTone(523, 'sine', 0.1, 0.25); setTimeout(() => this.playTone(659, 'sine', 0.15, 0.3), 100); }
            playFanfare() { this.vibrate([60, 40, 80]); const notes = [523.25, 659.25, 783.99, 1046.5]; notes.forEach((n, i) => { setTimeout(() => this.playTone(n, 'triangle', 0.22, 0.35), i * 110); }); }
            // Vocal feedback methods
            playWow() { if (typeof wowAudio !== 'undefined') wowAudio.currentTime = 0; wowAudio.play().catch(() => {}); }
            playAhh() { if (typeof ahhAudio !== 'undefined') ahhAudio.currentTime = 0; ahhAudio.play().catch(() => {}); }
            playHuy() { if (typeof huyAudio !== 'undefined') huyAudio.currentTime = 0; huyAudio.play().catch(() => {}); }
        }
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            vibrate(ms = 15) {
                if ('vibrate' in navigator) {
                    try { navigator.vibrate(ms); } catch (e) {}
                }
            }
            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playLock() {
                this.vibrate(25);
                this.playTone(420, 'triangle', 0.08, 0.2);
            }
            playThrow() {
                this.vibrate(18);
                this.playTone(280, 'sine', 0.12, 0.25);
            }
            playImpact(isHigh = false) {
                this.vibrate(isHigh ? 45 : 20);
                this.playTone(isHigh ? 680 : 340, 'triangle', 0.15, 0.3);
            }
            playCricketClose() {
                this.vibrate(50);
                this.playTone(523, 'sine', 0.1, 0.25);
                setTimeout(() => this.playTone(659, 'sine', 0.15, 0.3), 100);
            }
            playFanfare() {
                this.vibrate([60, 40, 80]);
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((n, i) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.22, 0.35), i * 110);
                });
            }
        }
        const sound = new MobileSoundEngine();

        /********************************************************************
         * 2. REGLAMENTO OFICIAL DE LA DIANA Y ESCALA 3D (REGLAS WDF / PDC)
         ********************************************************************/
        const DART_NUMBERS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        const CRICKET_TARGETS = [20, 19, 18, 17, 16, 15, 25]; // 25 = BULL

        // Proporciones oficiales exactas (Doble y Triple tienen el mismo espesor: 0.11 unidades)
        const BOARD_RADII = {
            innerBull: 0.075,
            outerBull: 0.185,
            tripleInner: 0.98,
            tripleOuter: 1.09,
            doubleInner: 1.59,
            doubleOuter: 1.70,   // Proporción reglamentaria oficial (espesor 0.11)
            boardEdge: 2.22      // Borde exterior con números
        };
        const BOARD_Z_SURFACE = 0.14;

        /********************************************************************
         * 3. TEXTURA PROCEDURAL DE SISAL (OPTIMIZADA PARA MÓVIL)
         ********************************************************************/
        function createMobileDartboardTextures() {
            const size = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2, cy = size / 2;
            const scale = (size / 2) / BOARD_RADII.boardEdge;

            // Borde exterior negro
            ctx.fillStyle = '#0f1115';
            ctx.beginPath();
            ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
            ctx.fill();

            const sliceAngle = (Math.PI * 2) / 20;

            for (let i = 0; i < 20; i++) {
                const startAngle = -Math.PI / 2 - sliceAngle / 2 + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                const isEven = i % 2 === 0;

                // Sector simple
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, BOARD_RADII.doubleOuter * scale, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = isEven ? '#17191e' : '#f5edd6';
                ctx.fill();

                // Doble
                ctx.beginPath();
                ctx.arc(cx, cy, BOARD_RADII.doubleOuter * scale, startAngle, endAngle);
                ctx.arc(cx, cy, BOARD_RADII.doubleInner * scale, endAngle, startAngle, true);
                ctx.fillStyle = isEven ? '#c81d25' : '#146936';
                ctx.fill();

                // Triple
                ctx.beginPath();
                ctx.arc(cx, cy, BOARD_RADII.tripleOuter * scale, startAngle, endAngle);
                ctx.arc(cx, cy, BOARD_RADII.tripleInner * scale, endAngle, startAngle, true);
                ctx.fillStyle = isEven ? '#c81d25' : '#146936';
                ctx.fill();
            }

            // Outer Bull
            ctx.beginPath();
            ctx.arc(cx, cy, BOARD_RADII.outerBull * scale, 0, Math.PI * 2);
            ctx.fillStyle = '#146936';
            ctx.fill();

            // Inner Bull
            ctx.beginPath();
            ctx.arc(cx, cy, BOARD_RADII.innerBull * scale, 0, Math.PI * 2);
            ctx.fillStyle = '#c81d25';
            ctx.fill();

            // Números oficiales
            const numberRadius = 1.95 * scale;
            ctx.font = '800 58px "Chakra Petch", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#f8fafc';

            for (let i = 0; i < 20; i++) {
                const angle = -Math.PI / 2 + i * sliceAngle;
                const nx = cx + Math.cos(angle) * numberRadius;
                const ny = cy + Math.sin(angle) * numberRadius;
                ctx.fillText(DART_NUMBERS[i].toString(), nx, ny);
            }

            const colorTex = new THREE.CanvasTexture(canvas);
            colorTex.anisotropy = 4;
            return colorTex;
        }

        function createDartMesh(colorHex = 0xf59e0b) {

            tipGeo.rotateX(-Math.PI / 2);
            const tipMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.9, roughness: 0.2 });
            const tipMesh = new THREE.Mesh(tipGeo, tipMat);
            tipMesh.position.z = -0.09;
            root.add(tipMesh);

            const barrelGeo = new THREE.CylinderGeometry(0.024, 0.024, 0.32, 12);
            barrelGeo.rotateX(Math.PI / 2);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0xb45309, metalness: 0.85, roughness: 0.3 });
            const barrelMesh = new THREE.Mesh(barrelGeo, barrelMat);
            barrelMesh.position.z = -0.32;
            root.add(barrelMesh);

            const shaftGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.38, 8);
            shaftGeo.rotateX(Math.PI / 2);
            const shaftMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.5 });
            const shaftMesh = new THREE.Mesh(shaftGeo, shaftMat);
            shaftMesh.position.z = -0.65;
            root.add(shaftMesh);

            const flightMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, side: THREE.DoubleSide });
            const f1 = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.16), flightMat);
            f1.position.z = -0.80;
            const f2 = f1.clone();
            f2.rotation.z = Math.PI / 2;
            root.add(f1, f2);

            return { root };
        }

        function launchDart(tx, ty, isBot = false) {
            const dartColor = isBot ? 0xb45309 : 0x10b981;
            const { root } = createDartMesh(dartColor);
            scene.add(root);
            state.spawnedDarts.push(root);

            const startPos = new THREE.Vector3(camera.position.x + 0.1, camera.position.y - 0.45, camera.position.z - 0.6);
            const endPos = new THREE.Vector3(tx, ty, BOARD_Z_SURFACE);

            state.activeFlight = {
                root,
                startPos,
                endPos,
                tx, ty,
                isBot,
                elapsed: 0,
                duration: 0.42,
                arc: 0.32,
                landed: false
            };
        }

        function evaluateHit(x, y) {
            const r = Math.hypot(x, y);
            if (r <= BOARD_RADII.innerBull) {
                return { points: 50, baseNumber: 25, multiplier: 2, isDouble: true, isTriple: false, isBull: true, label: '¡BULLSEYE! (50 pts)' };
            }
            if (r <= BOARD_RADII.outerBull) {
                return { points: 25, baseNumber: 25, multiplier: 1, isDouble: false, isTriple: false, isBull: true, label: 'Bull Exterior (25 pts)' };
            }
            if (r > BOARD_RADII.doubleOuter) {
                return { points: 0, baseNumber: 0, multiplier: 0, isDouble: false, isTriple: false, isBull: false, label: 'Fuera de Diana (0)' };
            }

            let angle = Math.atan2(x, y);
            if (angle < 0) angle += Math.PI * 2;
            const sliceAngle = (Math.PI * 2) / 20;
            const idx = Math.floor((angle + sliceAngle / 2) / sliceAngle) % 20;
            const base = DART_NUMBERS[idx];

            if (r >= BOARD_RADII.tripleInner && r <= BOARD_RADII.tripleOuter) {
                return { points: base * 3, baseNumber: base, multiplier: 3, isDouble: false, isTriple: true, isBull: false, label: `¡TRIPLE ${base}! (${base * 3})` };
            }
            if (r >= BOARD_RADII.doubleInner && r <= BOARD_RADII.doubleOuter) {
                return { points: base * 2, baseNumber: base, multiplier: 2, isDouble: true, isTriple: false, isBull: false, label: `¡DOBLE ${base}! (${base * 2})` };
            }
            return { points: base, baseNumber: base, multiplier: 1, isDouble: false, isTriple: false, isBull: false, label: `Simple ${base}` };
        }

        function applyCricketHit(hit, who = 'P1') {
            const target = hit.baseNumber;
            const hits = hit.multiplier;

            if (!CRICKET_TARGETS.includes(target) || hits <= 0) {
                return { closedNow: false, pointsAdded: 0, validCricketHit: false, marksAdded: 0 };
            }

            const myMarks = who === 'P1' ? state.cricketMarksP1 : state.cricketMarksP2;
            const oppMarks = who === 'P1' ? state.cricketMarksP2 : state.cricketMarksP1;

            const prev = myMarks[target] || 0;
            const needed = Math.max(0, 3 - prev);
            const used = Math.min(hits, needed);
            const extra = hits - used;

            myMarks[target] = Math.min(3, prev + hits);
            const closedNow = prev < 3 && myMarks[target] === 3;

            let pointsAdded = 0;
            const oppClosed = oppMarks[target] >= 3;

            if (extra > 0 && !oppClosed) {
                pointsAdded = extra * target;
                if (state.gameMode === 'CRICKET_CUTTHROAT') {
                    // En Cut-Throat, los puntos de penalización se le cargan al RIVAL
                    if (who === 'P1') {
                        state.cricketScoreP2 += pointsAdded;
                    } else {
                        state.cricketScoreP1 += pointsAdded;
                    }
                } else {
                    // En Cricket Normal, los puntos son para el lanzador
                    if (who === 'P1') {
                        state.cricketScoreP1 += pointsAdded;
                    } else {
                        state.cricketScoreP2 += pointsAdded;
                    }
                }
            }

            return {
                closedNow,
                pointsAdded,
                validCricketHit: true,
                marksAdded: hits,
                totalMarks: myMarks[target]
            };
        }

        function checkCricketWinCondition() {
            const p1All = CRICKET_TARGETS.every(t => state.cricketMarksP1[t] >= 3);
            const p2All = CRICKET_TARGETS.every(t => state.cricketMarksP2[t] >= 3);

            if (state.gameMode === 'CRICKET_CUTTHROAT') {
                // Cut-Throat: Quien cierra todo con MENOR o igual puntaje gana
                if (p1All && state.cricketScoreP1 <= state.cricketScoreP2) return 'P1';
                if (p2All && state.cricketScoreP2 <= state.cricketScoreP1) return (state.playerMode === 'VS_BOT' ? 'BOT' : 'P2');
            } else {
                // Cricket Normal: Quien cierra todo con MAYOR o igual puntaje gana
                if (p1All && state.cricketScoreP1 >= state.cricketScoreP2) return 'P1';
                if (p2All && state.cricketScoreP2 >= state.cricketScoreP1) return (state.playerMode === 'VS_BOT' ? 'BOT' : 'P2');
            }
            return null;
        }

        function onLanded(tx, ty, isBot = false) {
            const hit = evaluateHit(tx, ty);
            // Play impact sound first
            sound.playImpact(hit.points >= 40);
            // Vocal feedback based on hit result
            if (hit.points > 0) {
                // High scoring hit (>=40) gets a special ahh, otherwise wow
                if (hit.points >= 40) {
                    sound.playAhh();
                } else {
                    sound.playWow();
                }
            } else {
                // Missed the board
                sound.playHuy();
            }
            
            

            let bust = false;
            let win = false;

            if (state.gameMode === '501') {
                const rem = state.score - hit.points;
                if (rem < 0 || rem === 1 || (rem === 0 && !hit.isDouble)) {
                    bust = true;
                    state.score = state.turnStartScore;
                } else if (rem === 0 && hit.isDouble) {
                    state.score = 0;
                    win = true;
                } else {
                    state.score = rem;
                }
                state.dartsInTurn.push(hit);
            } else if (isCricketMode()) {
                const who = isBot ? 'P2' : (state.activePlayer === 'P1' ? 'P1' : 'P2');
                const cRes = applyCricketHit(hit, who);

                if (cRes.closedNow) sound.playCricketClose();

                state.dartsInTurn.push({ ...hit, points: cRes.pointsAdded });

                const winner = checkCricketWinCondition();
                if (winner) {
                    win = true;
                }

                const prefix = isBot ? '🤖 BOT: ' : '';
                if (cRes.closedNow && cRes.pointsAdded > 0) {
                    showFloatingBanner(`${prefix}¡CERRADO +${cRes.pointsAdded} PTS!`, hit.label, 'text-emerald-400');
                } else if (cRes.closedNow) {
                    const sec = hit.baseNumber === 25 ? 'BULL' : hit.baseNumber;
                    showFloatingBanner(`${prefix}¡${sec} CERRADO! (⊗)`, hit.label, 'text-emerald-400');
                } else if (cRes.pointsAdded > 0) {
                    const isCut = state.gameMode === 'CRICKET_CUTTHROAT';
                    showFloatingBanner(
                        isCut ? `${prefix}+${cRes.pointsAdded} CASTIGO AL RIVAL` : `${prefix}+${cRes.pointsAdded} PUNTOS`,
                        hit.label,
                        isCut ? 'text-rose-400' : 'text-amber-300'
                    );
                } else if (cRes.validCricketHit) {
                    showFloatingBanner(`${prefix}${hit.label}`, `${cRes.marksAdded} marca(s) en ${hit.baseNumber === 25 ? 'Bull' : hit.baseNumber}`, 'text-amber-300');
                } else {
                    showFloatingBanner(`${prefix}${hit.label}`, 'Sector no puntuable en Cricket', 'text-slate-400');
                }
            } else {
                // Práctica
                state.score += hit.points;
                state.dartsInTurn.push(hit);
                showFloatingBanner(hit.label, `+${hit.points} pts`, 'text-amber-300');
            }

            updateMobileHUD();

            if (win) {
                sound.playFanfare();
                const winnerName = isBot ? state.p2Name : (state.activePlayer === 'P1' ? state.p1Name : state.p2Name);
                showFloatingBanner(`🏆 ¡GANA ${winnerName.toUpperCase()}!`, 'Partida Finalizada', 'text-emerald-400');
                setTimeout(() => resetMatch(), 3400);
                return;
            }

            if (state.gameMode === '501') {
                if (bust) {
                    showFloatingBanner('¡PASADO! (BUST)', 'Requiere Doble exacto', 'text-rose-400');
                    while (state.dartsInTurn.length < 3) state.dartsInTurn.push({ points: 0, label: 'Anulado' });
                    updateMobileHUD();
                } else {
                    showFloatingBanner(hit.label, `Dardo ${state.dartsInTurn.length}/3`, hit.points >= 40 ? 'text-emerald-400' : 'text-amber-300');
                }
            }

            if (isBot && state._nextBotThrow) {
                state._nextBotThrow();
                return;
            }

            setTimeout(() => {
                if (state.dartsInTurn.length >= 3) {
                    if (state.playerMode === 'VS_BOT') {
                        runMobileBotTurn();
                        return;
                    }
                    if (state.playerMode === '2P') {
                        if (state.activePlayer === 'P1') {
                            state.activePlayer = 'P2';
                            if (state.gameMode === '501') {
                                state.scoreP1 = state.score;
                                state.score = state.scoreP2;
                                state.turnStartScore = state.scoreP2;
                            }
                            clearDarts();
                            updateMobileHUD();
                            showFloatingBanner(`Turno de ${state.p2Name}`, '3 dardos listos', 'text-amber-300');
        // Frase después del turno en modo 501 o Cricket o Práctica
        const phraseP2 = state.gameMode === '501' ? '¡Mantén la concentración!' : (isCricketMode() ? '¡Buen tiro!' : '¡Practica tu precisión!');
        showFloatingBanner(phraseP2, '', 'text-slate-300');
                        } else {
                            state.activePlayer = 'P1';
                            if (state.gameMode === '501') {
                                state.scoreP2 = state.score;
                                state.score = state.scoreP1;
                                state.turnStartScore = state.scoreP1;
                            }
                            state.round++;
                            clearDarts();
                            updateMobileHUD();
                            showFloatingBanner(`Turno de ${state.p1Name}`, `Ronda ${state.round}`, 'text-emerald-300');
        // Frase después del turno en modo 501 o Cricket o Práctica
        const phraseP1 = state.gameMode === '501' ? '¡Mantén la concentración!' : (isCricketMode() ? '¡Buen tiro!' : '¡Practica tu precisión!');
        showFloatingBanner(phraseP1, '', 'text-slate-300');
                        }
                        setMobilePhase(1);
                        return;
                    }
                    state.round++;
        // Frase al completar ronda en modo 501 o Cricket o Práctica
        const phraseRound = state.gameMode === '501' ? '¡Sigue así!' : (isCricketMode() ? '¡Excelente juego!' : '¡Sigue practicando!');
        showFloatingBanner(phraseRound, '', 'text-slate-300');
                    clearDarts();
                }
                setMobilePhase(1);
            }, 600);
        }

        function runMobileBotTurn() {
            state.activePlayer = 'BOT';
            clearDarts();
            if (state.gameMode === '501') {
                state.score = state.scoreP2;
                state.turnStartScore = state.scoreP2;
            }
            updateMobileHUD();
            mobPhaseText.textContent = `🤖 Turno de ${state.p2Name}...`;

            let botDart = 0;
            function throwBotDart() {
                let chosenTarget = 20;
                let r = (BOARD_RADII.tripleInner + BOARD_RADII.tripleOuter) / 2;

                if (isCricketMode()) {
                    // IA en Cricket
                    const isCut = state.gameMode === 'CRICKET_CUTTHROAT';
                    let candidate = null;

                    if (isCut && state.cricketScoreP2 > state.cricketScoreP1) {
                        // En Cut-Throat, si la IA tiene más puntos (está perdiendo), tira a sus números cerrados para castigar
                        candidate = CRICKET_TARGETS.find(t => state.cricketMarksP2[t] >= 3 && state.cricketMarksP1[t] < 3);
                    } else if (!isCut && state.cricketScoreP2 < state.cricketScoreP1) {
                        // En Cricket normal, si va perdiendo en puntos, anota en sus abiertos
                        candidate = CRICKET_TARGETS.find(t => state.cricketMarksP2[t] >= 3 && state.cricketMarksP1[t] < 3);
                    }

                    if (!candidate) {
                        // Busca su objetivo no cerrado de mayor valor
                        candidate = CRICKET_TARGETS.find(t => state.cricketMarksP2[t] < 3) || 25;
                    }

                    chosenTarget = candidate;
                    if (chosenTarget === 25) r = 0;
                } else if (state.gameMode === '501') {
                    const rem = state.score;
                    if (rem <= 40 && rem % 2 === 0 && rem >= 2) {
                        chosenTarget = rem / 2;
                        r = (BOARD_RADII.doubleInner + BOARD_RADII.doubleOuter) / 2;
                    } else if (rem === 50) {
                        chosenTarget = 25;
                        r = 0;
                    }
                }

                let tx = 0, ty = 0;
                if (chosenTarget !== 25) {
                    const idx = DART_NUMBERS.indexOf(chosenTarget);
                    const angle = idx * ((Math.PI * 2) / 20);
                    tx = Math.sin(angle) * r;
                    ty = Math.cos(angle) * r;
                }
                const spread = [0.18, 0.11, 0.05][state.difficultyIdx];
                tx += (Math.random() - 0.5) * spread * 2;
                ty += (Math.random() - 0.5) * spread * 2;

                launchDart(tx, ty, true);
                botDart++;
            }

            setTimeout(throwBotDart, 600);
            state._nextBotThrow = () => {
                if (state.gameMode === '501' && state.score === 0) return;
                if (isCricketMode() && checkCricketWinCondition()) return;

                if (botDart < 3 && (state.gameMode !== '501' || state.score > 1)) {
                    setTimeout(throwBotDart, 700);
                } else {
                    setTimeout(() => {
                        if (state.gameMode === '501') {
                            state.scoreP2 = state.score;
                            state.score = state.scoreP1;
                            state.turnStartScore = state.scoreP1;
                        }
                        state.activePlayer = 'P1';
                        state.round++;
                        clearDarts();
                        updateMobileHUD();
                        setMobilePhase(1);
                    }, 900);
                }
            };
        }

        function clearDarts() {
            state.spawnedDarts.forEach(d => scene.remove(d));
            state.spawnedDarts = [];
            state.dartsInTurn = [];
        }

        function resetMatch() {
            clearDarts();
            state.round = 1;
            state.activePlayer = 'P1';
            state.scoreP1 = 501;
            state.scoreP2 = 501;
            state.score = 501;
            state.turnStartScore = 501;
            state.cricketMarksP1 = createEmptyCricketMap();
            state.cricketMarksP2 = createEmptyCricketMap();
            state.cricketScoreP1 = 0;
            state.cricketScoreP2 = 0;
            updateMobileHUD();
            setMobilePhase(1);
        }

        function showFloatingBanner(title, sub = '', colorCls = 'text-amber-300') {
            const el = document.createElement('div');
            el.className = 'fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none z-50 animate-feedback';
            el.innerHTML = `
                <div class="hud-glass px-5 py-2.5 rounded-2xl border-amber-600/50 shadow-2xl">
                    <div class="font-display font-extrabold text-2xl ${colorCls} tracking-wider">${title}</div>
                    ${sub ? `<div class="text-xs text-amber-200/80 mt-0.5">${sub}</div>` : ''}
                </div>
            `;
            floatingContainer.appendChild(el);
            setTimeout(() => el.remove(), 1300);
        }

        /********************************************************************
         * 7. CONTROLES TÁCTILES, RAYCASTING Y ZOOM
         ********************************************************************/
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();
        const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -BOARD_Z_SURFACE);
        const intersectPoint = new THREE.Vector3();

        function handlePointerAim(clientX, clientY) {
            if (state.phase !== 1) return;
            pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
            pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, camera);
            if (raycaster.ray.intersectPlane(aimPlane, intersectPoint)) {
                const maxR = BOARD_RADII.doubleOuter + 0.15;
                const r = Math.hypot(intersectPoint.x, intersectPoint.y);
                if (r > maxR) {
                    intersectPoint.x = (intersectPoint.x / r) * maxR;
                    intersectPoint.y = (intersectPoint.y / r) * maxR;
                }
                state.hoverTarget.set(intersectPoint.x, intersectPoint.y);
                aimGroup.position.x = intersectPoint.x;
                aimGroup.position.y = intersectPoint.y;
                updateAimPreview();
            }
        }

        // Zoom con Rueda del Ratón
        window.addEventListener('wheel', (e) => {
            if (e.target.closest('#mobile-setup-modal, #mobile-cricket-drawer')) return;
            e.preventDefault();
            const delta = -e.deltaY * 0.0018;
            targetZoom = Math.max(0.65, Math.min(1.85, targetZoom + delta));
        }, { passive: false });

        // Zoom con 2 dedos (Pinch-to-zoom)
        let pinchDistStart = 0;
        let pinchZoomStart = 1.0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchDistStart = Math.hypot(dx, dy);
                pinchZoomStart = targetZoom;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && pinchDistStart > 10) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const ratio = dist / pinchDistStart;
                targetZoom = Math.max(0.65, Math.min(1.85, pinchZoomStart * ratio));
            }
        }, { passive: true });

        // Botones rápidos de zoom en pantalla
        document.getElementById('mob-zoom-in').addEventListener('click', (e) => {
            e.stopPropagation();
            targetZoom = Math.min(1.85, targetZoom + 0.22);
        });
        document.getElementById('mob-zoom-out').addEventListener('click', (e) => {
            e.stopPropagation();
            targetZoom = Math.max(0.65, targetZoom - 0.22);
        });
        document.getElementById('mob-zoom-reset').addEventListener('click', (e) => {
            e.stopPropagation();
            targetZoom = 1.0;
        });

        // Apuntado táctil con arrastre y toque directo
        let isTouchingBoard = false;
        let lastTapTime = 0;

        function isInteractiveElement(target) {
            return target && target.closest && target.closest('button, #mobile-setup-modal, #zoom-controls, #mobile-cricket-drawer, input, a');
        }

        window.addEventListener('pointerdown', (e) => {
                // Capture the pointer so we continue receiving move events even if finger leaves the canvas
                if (e.target && e.target.setPointerCapture) {
                    e.target.setPointerCapture(e.pointerId);
                }
            if (isInteractiveElement(e.target)) return;
            if (state.activeFlight || state.activePlayer === 'BOT') return;

            if (state.phase === 1) {
                isTouchingBoard = true;
                handlePointerAim(e.clientX, e.clientY);

                const now = Date.now();
                if (now - lastTapTime < 350) {
                    // Doble toque rápido confirma el objetivo
                    triggerMobileAction();
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;
            } else if (state.phase === 2 || state.phase === 3) {
                triggerMobileAction();
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (state.phase === 1 && (isTouchingBoard || e.pointerType === 'mouse')) {
                handlePointerAim(e.clientX, e.clientY);
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (isTouchingBoard) {
                isTouchingBoard = false;
                if (state.phase === 1) {
                    handlePointerAim(e.clientX, e.clientY);
                }
            }
        });

        window.addEventListener('pointercancel', () => {
            isTouchingBoard = false;
        });

        document.getElementById('mob-btn-action').addEventListener('click', (e) => {
            e.stopPropagation();
            triggerMobileAction();
        });

        const mobBtnCancel = document.getElementById('mob-btn-cancel');
        if (mobBtnCancel) {
            mobBtnCancel.addEventListener('click', (e) => {
                e.stopPropagation();
                if (state.phase === 2 || state.phase === 3) {
                    setMobilePhase(1);
                }
            });
        }

        // Alternar Pizarra Cricket
        btnToggleCricket.addEventListener('click', () => {
            cricketDrawer.classList.toggle('collapsed');
        });
        document.getElementById('btn-close-cricket').addEventListener('click', () => {
            cricketDrawer.classList.add('collapsed');
        });

        // Configuración y opciones
        const modal = document.getElementById('mobile-setup-modal');
        document.getElementById('btn-open-menu').addEventListener('click', () => {
            modal.classList.remove('hidden');
        });

        document.querySelectorAll('.mob-opt-btn').forEach(b => {
            b.addEventListener('click', () => {
                document.querySelectorAll('.mob-opt-btn').forEach(x => {
                    x.className = 'mob-opt-btn py-2 px-1 rounded-xl border border-amber-900/40 bg-black/40 text-amber-200/70 font-semibold text-xs flex flex-col items-center gap-1';
                });
                b.className = 'mob-opt-btn active-opt py-2 px-1 rounded-xl border border-emerald-500/50 bg-emerald-900/40 text-emerald-200 font-bold text-xs flex flex-col items-center gap-1';
                state.playerMode = b.getAttribute('data-opp');
                document.getElementById('mob-p2-name-wrap').style.display = state.playerMode === 'SOLO' ? 'none' : 'block';
                document.getElementById('mob-diff-wrap').style.display = state.playerMode === 'VS_BOT' ? 'block' : 'none';
            });
        });

        document.querySelectorAll('.mob-mode-btn').forEach(b => {
            b.addEventListener('click', () => {
                document.querySelectorAll('.mob-mode-btn').forEach(x => {
                    x.className = 'mob-mode-btn py-2 px-1 rounded-xl border border-amber-900/40 bg-black/40 text-amber-200/70 font-semibold text-[11px] text-center';
                });
                b.className = 'mob-mode-btn py-2 px-1 rounded-xl border border-amber-500 bg-amber-700/30 text-amber-200 font-bold text-[11px] text-center';
                state.gameMode = b.getAttribute('data-mode');
            });
        });

        document.querySelectorAll('.mob-diff-btn').forEach(b => {
            b.addEventListener('click', () => {
                document.querySelectorAll('.mob-diff-btn').forEach(x => {
                    x.className = 'mob-diff-btn py-1 rounded-lg border border-amber-900/40 bg-black/40 text-amber-200/70 text-xs';
                });
                b.className = 'mob-diff-btn py-1 rounded-lg border border-emerald-500 bg-emerald-900/30 text-emerald-200 text-xs font-bold';
                state.difficultyIdx = parseInt(b.getAttribute('data-diff'), 10);
            });
        });

        document.getElementById('mob-btn-play-confirm').addEventListener('click', () => {
            state.p1Name = document.getElementById('mob-input-p1').value.trim() || 'COKE';
            state.p2Name = document.getElementById('mob-input-p2').value.trim() || (state.playerMode === 'VS_BOT' ? 'ORDENADOR (IA)' : 'JUGADOR 2');
            modal.classList.add('hidden');
            sound.init();
            resetMatch();
        });

        /********************************************************************
         * 8. BUCLE PRINCIPAL DE ANIMACIÓN CON ZOOM SUAVE
         ********************************************************************/
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            // Interpolación de Zoom
            currentZoom += (targetZoom - currentZoom) * 0.15;
            camera.position.z = BASE_CAM_POS.z / currentZoom;
            camera.position.y = CAM_LOOK.y + (BASE_CAM_POS.y - CAM_LOOK.y) / currentZoom;
            camera.lookAt(CAM_LOOK);

            if (state.phase === 1) {
                if (!isTouchingBoard) {
                    aimGroup.position.x += (state.hoverTarget.x - aimGroup.position.x) * 0.4;
                    aimGroup.position.y += (state.hoverTarget.y - aimGroup.position.y) * 0.4;
                }
            } else if (state.phase === 2 || state.phase === 3) {
                aimGroup.position.x = state.lockedArea.x;
                aimGroup.position.y = state.lockedArea.y;
            }
            
            if (state.phase === 2) {
                const speed = BAR_SPEEDS[state.difficultyIdx];
                state.barPos += state.barDir * speed * dt;
                if (state.barPos >= 1.0) { state.barPos = 1.0; state.barDir = -1; }
                else if (state.barPos <= 0.0) { state.barPos = 0.0; state.barDir = 1; }
                mobBarNeedle.style.left = `${state.barPos * 100}%`;
            } else if (state.phase === 3) {
                state.swayClock += dt * 3.5;
                const err = 1.0 - state.precisionFactor;
                const r = 0.03 + err * 0.22;
                state.currentSwayPos.set(
                    state.lockedArea.x + Math.sin(state.swayClock * 2.1) * r,
                    state.lockedArea.y + Math.cos(state.swayClock * 2.8) * r
                );
                swayGroup.position.x = state.currentSwayPos.x;
                swayGroup.position.y = state.currentSwayPos.y;
            }

            if (state.activeFlight) {
                const fl = state.activeFlight;
                fl.elapsed += dt;
                const t = Math.min(1.0, fl.elapsed / fl.duration);
                const pos = new THREE.Vector3().lerpVectors(fl.startPos, fl.endPos, t);
                pos.y += Math.sin(t * Math.PI) * fl.arc;
                fl.root.position.copy(pos);

                if (t >= 1.0 && !fl.landed) {
                    fl.landed = true;
                    fl.root.position.copy(fl.endPos);
                    fl.root.rotation.set(-0.06, 0, 0);
                    state.activeFlight = null;
                    onLanded(fl.tx, fl.ty, fl.isBot);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            camera.fov = aspect < 0.72 ? 54 : 44;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = () => {
            updateMobileHUD();
            setMobilePhase(1);
            animate();
        };
    </script>
</body>
</html>
